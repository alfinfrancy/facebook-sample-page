<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Clone - Trackpi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-left"><h2>facebook</h2></div>
  <div class="nav-center"><input type="text" placeholder="Search Facebook"></div>
  <div class="nav-right">
    <button id="themeToggle">🌙 Dark Mode</button>
    <img src="https://i.pravatar.cc/40" class="avatar">
  </div>
</header>

<div class="container">
  <aside class="sidebar"> 
    <p>🏠 Home</p><p>👥 Friends</p><p>📺 Watch</p><p>🏪 Marketplace</p><p>👨‍👩‍👧 Groups</p>
  </aside>
  
  <main class="feed" id="feed"></main>
  
  <aside class="rightbar">
    <h4>Contacts</h4>
    <p><img src="https://i.pravatar.cc/30?img=1"> Alfin Francy</p>
    <p><img src="https://i.pravatar.cc/30?img=2"> John Doe</p>
  </aside>
</div>
<script src="script.js"></script>
</body>
</html>
